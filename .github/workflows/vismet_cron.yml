
name: Extraccion Diaria VisMet

on:
  schedule:
    # 06:00 UTC equivale a las 03:00 AM (Chile)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecucion manual desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps

    - name: Ejecutar Script de Extraccion
      run: python scrapper_vismet_acumulado_2026.py

    - name: Guardar CSVs Actualizados en el Repositorio
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add origen_*.csv
        git commit -m "Actualizacion automatica VisMet" || exit 0
        git push
