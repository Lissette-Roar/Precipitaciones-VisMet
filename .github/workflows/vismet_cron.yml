name: Extraccion Diaria VisMet

on:
  schedule:
    # 06:00 UTC equivale a las 03:00 AM (Chile)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecucion manual desde GitHub

# PERMISOS NECESARIOS PARA GUARDAR EL CSV
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps

    - name: Ejecutar Script de Extraccion
      run: python scrapper_VisMet_Bypass.py

    - name: Subir CSV a OneDrive
      env:
        MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
        MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
        MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
        MS_USER_EMAIL: ${{ secrets.MS_USER_EMAIL }}
      run: python subir_onedrive.py
      
    - name: Guardar CSVs Actualizados en el Repositorio
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add origen_vismet_*.csv
        git commit -m "Actualizacion automatica VisMet" || exit 0
        git push
